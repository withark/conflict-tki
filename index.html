<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갈등관리 유형 진단 · 위드아크 WithArk</title>
<style>
  :root{
    --ink:#1C3A2E;        /* deep forest ink */
    --ink-soft:#4A5D52;
    --paper:#FBF8F1;      /* warm workshop paper */
    --card:#FFFFFF;
    --line:#E7E1D4;
    --green:#2E9E5B;      /* WithArk green */
    --green-d:#247A45;
    --orange:#F2884B;     /* WithArk orange */
    --orange-d:#D96E33;
    --yellow:#F6C744;     /* WithArk yellow */
    /* mode spectrum: hot(assertive) -> cold */
    --m-comp:#E2603F;
    --m-collab:#2E9E5B;
    --m-compr:#E8A41F;
    --m-avoid:#7E8CA0;
    --m-accom:#4FA8C9;
    --shadow:0 8px 30px rgba(28,58,46,.08);
    --shadow-sm:0 2px 10px rgba(28,58,46,.06);
    --radius:18px;
    --font: "Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.55}
  body{min-height:100vh}
  .wrap{max-width:880px;margin:0 auto;padding:24px 20px 80px}
  .center{max-width:680px}

  /* ---------- header ---------- */
  .brandbar{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  .brandmark{width:30px;height:30px;border-radius:9px;background:
     conic-gradient(from 210deg, var(--green) 0 33%, var(--yellow) 33% 66%, var(--orange) 66% 100%);
     box-shadow:var(--shadow-sm)}
  .brandtxt{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .brandtxt span{color:var(--green)}
  .brandtag{margin-left:auto;font-size:12px;color:var(--ink-soft);font-weight:600;
     border:1px solid var(--line);padding:5px 11px;border-radius:999px;background:var(--card)}

  /* ---------- cards / generic ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px}
  .card + .card{margin-top:18px}
  .eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green-d)}
  h1.title{font-size:34px;line-height:1.12;font-weight:800;letter-spacing:-.022em;margin:12px 0 0}
  h1.title b{color:var(--green)}
  .lede{margin-top:14px;font-size:16px;color:var(--ink-soft);max-width:48ch}
  h2.sec{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0}
  .muted{color:var(--ink-soft)}
  .small{font-size:13px}
  code{background:#F0EBDF;padding:1px 6px;border-radius:5px;font-size:.9em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  /* ---------- buttons ---------- */
  .btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:15.5px;
     padding:14px 22px;border-radius:13px;transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
     display:inline-flex;align-items:center;gap:9px;justify-content:center}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--green);color:#fff;box-shadow:0 6px 18px rgba(46,158,91,.28)}
  .btn-primary:hover{background:var(--green-d)}
  .btn-accent{background:var(--orange);color:#fff;box-shadow:0 6px 18px rgba(242,136,75,.28)}
  .btn-accent:hover{background:var(--orange-d)}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn-ghost:hover{border-color:#cfc8b8;background:#fbfaf6}
  .btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
  .btn-block{width:100%}
  .btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
  .btnrow .grow{flex:1 1 auto}

  /* ---------- home actions ---------- */
  .home-actions{display:grid;grid-template-columns:1fr;gap:14px;margin-top:28px}
  .action-tile{display:flex;gap:16px;align-items:center;text-align:left;border:1.5px solid var(--line);
     background:var(--card);border-radius:15px;padding:18px 20px;cursor:pointer;transition:border-color .15s, transform .08s, box-shadow .15s}
  .action-tile:hover{border-color:var(--green);box-shadow:var(--shadow-sm)}
  .action-tile:active{transform:translateY(1px)}
  .action-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;font-weight:800;color:#fff;font-size:19px}
  .action-ic.a{background:var(--green)}
  .action-ic.b{background:var(--ink)}
  .action-tx b{display:block;font-size:16px;font-weight:800}
  .action-tx span{font-size:13.5px;color:var(--ink-soft)}

  /* ---------- mode mini cards (guide) ---------- */
  .axis-explain{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  .axis-box{border:1px solid var(--line);border-radius:13px;padding:16px}
  .axis-box b{font-size:14.5px}
  .axis-box p{font-size:13px;color:var(--ink-soft);margin-top:4px}
  .modegrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}
  .modeline{display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line);border-radius:13px;padding:14px 16px}
  .swatch{width:13px;height:13px;border-radius:5px;margin-top:5px;flex:0 0 auto}
  .modeline b{font-size:15px}
  .modeline .tg{font-size:13px;color:var(--ink-soft)}

  /* ---------- form ---------- */
  .field{margin-top:18px}
  .field label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}
  .field input{width:100%;font-family:inherit;font-size:16px;padding:14px 15px;border:1.5px solid var(--line);
     border-radius:12px;background:#fff;color:var(--ink);transition:border-color .15s}
  .field input:focus{outline:none;border-color:var(--green)}
  .field .hint{font-size:12.5px;color:var(--ink-soft);margin-top:6px}

  /* ---------- progress ---------- */
  .progress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .progress-head .qn{font-weight:800;font-size:15px}
  .progress-head .qn em{color:var(--green);font-style:normal}
  .progress-head .pct{font-size:13px;color:var(--ink-soft);font-weight:600}
  .bar{height:9px;background:#EDE7DA;border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--yellow));transition:width .3s ease}

  /* ---------- quiz ---------- */
  .qsit{font-size:19px;color:var(--ink);margin:22px 0 2px;font-weight:800;line-height:1.45}
  .qstem{font-size:13.5px;color:var(--ink-soft);margin:0 0 4px;font-weight:600}
  .qopts{display:grid;gap:13px;margin-top:14px}
  .opt{position:relative;text-align:left;border:1.8px solid var(--line);background:#fff;border-radius:15px;
     padding:18px 18px 18px 56px;cursor:pointer;font-family:inherit;font-size:15.5px;color:var(--ink);line-height:1.5;
     transition:border-color .12s, background .12s, box-shadow .12s}
  .opt:hover{border-color:#bdd9c8}
  .opt .pick{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;
     border:2px solid #d7d0c1;display:grid;place-items:center;font-weight:800;color:#b7b0a0;font-size:13px;background:#fff;transition:all .12s}
  .opt.sel{border-color:var(--green);background:#f3fbf6;box-shadow:0 4px 14px rgba(46,158,91,.13)}
  .opt.sel .pick{background:var(--green);border-color:var(--green);color:#fff}
  .navrow{display:flex;justify-content:space-between;gap:12px;margin-top:24px}

  /* ---------- result ---------- */
  .res-hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .res-badge{flex:0 0 auto;width:108px;height:108px;border-radius:24px;display:grid;place-items:center;color:#fff;
     box-shadow:var(--shadow);text-align:center;padding:8px}
  .res-badge .en{font-size:11px;font-weight:700;opacity:.9;letter-spacing:.05em}
  .res-badge .ko{font-size:23px;font-weight:800;line-height:1.1;margin-top:2px}
  .res-hd .who{font-size:13px;color:var(--ink-soft);font-weight:600}
  .res-hd h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:2px 0 6px}
  .res-hd .tag{font-size:15px;color:var(--ink-soft)}
  .tied-note{margin-top:14px;font-size:13.5px;background:#FFF8E8;border:1px solid #F3E2AE;color:#8a6d1f;
     padding:11px 14px;border-radius:11px}

  .res-desc{margin-top:20px;font-size:15.5px;color:#33433b;line-height:1.65}

  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
  .dbox{border:1px solid var(--line);border-radius:13px;padding:15px 16px}
  .dbox h4{font-size:13px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:7px;margin-bottom:8px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .dbox ul{list-style:none;display:grid;gap:6px}
  .dbox li{font-size:13.5px;color:var(--ink-soft);padding-left:16px;position:relative;line-height:1.45}
  .dbox li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--green)}
  .dbox.warn li::before{background:var(--orange)}
  .dbox p{font-size:13.5px;color:var(--ink-soft);line-height:1.5}

  /* score bars */
  .scorelist{display:grid;gap:13px;margin-top:8px}
  .scorerow{display:grid;grid-template-columns:84px 1fr 34px;align-items:center;gap:12px}
  .scorerow .nm{font-size:13.5px;font-weight:700}
  .scorerow .track{height:14px;background:#EFEADF;border-radius:999px;overflow:hidden}
  .scorerow .track > i{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.7,.3,1)}
  .scorerow .vv{font-size:13px;font-weight:800;text-align:right;color:var(--ink-soft)}

  /* grid svg */
  .gridwrap{display:flex;justify-content:center;margin-top:8px}
  .gridwrap svg{width:100%;max-width:380px;height:auto}

  .flex-detail{margin-top:18px;font-size:14px;color:var(--ink-soft);background:#F6FBF8;border:1px solid #d7ecdf;
     padding:14px 16px;border-radius:12px;line-height:1.55}
  .flex-detail b{color:var(--green-d)}

  /* ---------- admin ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
  .stat{border:1px solid var(--line);border-radius:13px;padding:15px 16px;text-align:center}
  .stat .num{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--green)}
  .stat .lab{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:2px}

  .distrib{display:grid;gap:11px;margin-top:8px}
  .distrib .drow{display:grid;grid-template-columns:78px 1fr 56px;align-items:center;gap:11px}
  .distrib .nm{font-size:13.5px;font-weight:700}
  .distrib .track{height:22px;background:#EFEADF;border-radius:8px;overflow:hidden;position:relative}
  .distrib .track > i{display:block;height:100%;border-radius:8px;transition:width .6s ease}
  .distrib .cnt{font-size:12.5px;font-weight:700;color:var(--ink-soft);text-align:right}

  .insight{background:#F6FBF8;border:1px solid #d7ecdf;border-radius:14px;padding:18px 20px;margin-top:6px}
  .insight h4{font-size:14px;font-weight:800;margin-bottom:8px;color:var(--green-d)}
  .insight p{font-size:14px;color:#33433b;line-height:1.6}
  .insight p + p{margin-top:9px}
  .guide-q{display:grid;gap:9px;margin-top:10px}
  .guide-q .gq{font-size:13.5px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px;position:relative;padding-left:36px}
  .guide-q .gq b{position:absolute;left:13px;top:11px;color:var(--orange);font-weight:800}

  .tablewrap{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:13px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
  thead th{background:#F4EFE4;text-align:left;padding:11px 12px;font-weight:700;color:var(--ink);white-space:nowrap;border-bottom:1px solid var(--line)}
  tbody td{padding:11px 12px;border-bottom:1px solid #F0EBDF;white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  td .pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px}
  td .pill .dot{width:8px;height:8px}
  .num-cell{text-align:center;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .num-cell.top{color:var(--ink);font-weight:800}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft)}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .toolbar .btn{font-size:14px;padding:11px 16px}

  .footnote{margin-top:26px;text-align:center;font-size:12px;color:#9aa297;line-height:1.6}
  .footnote a{color:var(--ink-soft)}

  .loader{display:flex;align-items:center;gap:11px;color:var(--ink-soft);font-size:14px;padding:8px 0}
  .spin{width:18px;height:18px;border:2.5px solid #E0DACB;border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .pwline{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .pwline input{flex:1 1 200px}
  .err{color:#c0392b;font-size:13px;margin-top:9px;font-weight:600}
  .savebar{margin:0 0 14px;padding:11px 15px;border-radius:12px;font-size:13.5px;font-weight:600;line-height:1.5}
  .savebar.saving{background:#FBF6E9;color:#9a7b27;border:1px solid #F0E4C4}
  .savebar.ok{background:#EEF7F0;color:#247A45;border:1px solid #CDE9D3}
  .savebar.fail{background:#FDEEEC;color:#b5362a;border:1px solid #F4C9C2}
  .savebar.local{background:#F4F2EC;color:#6b6357;border:1px solid #E4DECF}
  .linkbtn{background:none;border:none;color:inherit;font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;padding:0}
  .filterbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:16px;padding:12px 15px;background:#F7F5EF;border:1px solid #E7E1D4;border-radius:14px;font-size:13px}
  .filterbar label{display:flex;align-items:center;gap:7px;font-weight:700;color:var(--ink-soft)}
  .filterbar select{font:inherit;font-weight:600;color:var(--ink);padding:6px 10px;border:1px solid #DAD3C4;border-radius:8px;background:#fff;max-width:210px}
  .fcount{color:var(--ink-soft);font-weight:600;margin-left:auto}
  .pubtoggle{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:16px;padding:12px 16px;background:#fff;border:1px dashed #BFD4C6;border-radius:14px}
  /* ---------- 세션(회차) 구분 ---------- */
  .sessbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:14px;padding:12px 15px;border:1px solid #E7E1D4;background:#F7F5EF;border-radius:14px;font-size:13px}
  .sessbar.live{border-color:#BFD4C6;background:#F1F8F3}
  .sessbar .stitle{font-weight:800;color:var(--ink)}
  .sessbar .sdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#C0392B;margin-right:7px;vertical-align:middle}
  .sessbar .sdesc{color:var(--ink-soft);font-weight:600;flex:1 1 220px;min-width:0}
  .sessbar .sgrow{display:flex;flex-wrap:wrap;gap:7px;margin-left:auto}
  .btn-mini{font:inherit;font-size:12px;font-weight:700;padding:6px 11px;border-radius:8px;border:1px solid #DAD3C4;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
  .btn-mini:hover{background:#F2EEE4}
  .sessnote{flex:1 1 100%;margin-top:2px;font-size:12.5px;font-weight:600;line-height:1.55;color:var(--ink-soft);background:#fff;border:1px solid #E7E1D4;border-radius:10px;padding:8px 11px}
  .sessnote.warn{color:#8A5A12;background:#FDF6E7;border-color:#F0E0BC}
  .sessbar select{font:inherit;font-weight:600;color:var(--ink);padding:6px 10px;border:1px solid #DAD3C4;border-radius:8px;background:#fff;max-width:280px}
  .glabel{font-weight:700;color:var(--ink-soft)}
  .grp-controls{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin:16px 0 2px}
  .seg{display:inline-flex;border:1px solid #DAD3C4;border-radius:9px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:7px 13px;font:inherit;font-weight:600;color:var(--ink-soft);cursor:pointer}
  .seg button.on{background:var(--green);color:#fff}
  .grp-num{width:66px;font:inherit;font-weight:700;text-align:center;padding:7px 8px;border:1px solid #DAD3C4;border-radius:8px}
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;margin-top:16px}
  .grp{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#FCFBF8}
  .grp-head{font-weight:800;margin-bottom:6px;font-size:15px}
  .grp-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px;border-top:1px solid #F0EDE4}
  .grp-row:first-of-type{border-top:none}
  .grp-row .gn{font-weight:700}
  .grp-row .gt{font-size:11px}
  .grp-row .gtype{margin-left:auto;font-weight:700;font-size:12px;white-space:nowrap}
  .grp-row .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .grp-comp{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
  .gchip{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px}
  .gstats{display:flex;gap:12px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid #EFEBE0}
  .gsbars{flex:1;min-width:0}
  .gsrow{display:flex;align-items:center;gap:7px;margin-bottom:3px}
  .gsn{font-size:10.5px;font-weight:800;width:26px;flex:none}
  .gstrack{flex:1;height:7px;background:#EDE7DA;border-radius:999px;overflow:hidden}
  .gstrack i{display:block;height:100%;border-radius:999px}
  .gsv{font-size:10.5px;font-weight:700;color:var(--ink-soft);width:22px;text-align:right;flex:none}
  .gsgrid{flex:none;text-align:center}
  .gslabel{display:block;font-size:10px;color:var(--ink-soft);margin-top:2px}
  .capturing .no-print{display:none !important}
  .export-ov{position:fixed;inset:0;background:rgba(28,58,46,.5);display:flex;align-items:center;justify-content:center;z-index:9999}
  .export-box{background:#fff;border-radius:14px;padding:18px 24px;display:flex;align-items:center;gap:12px;font-weight:800;color:var(--ink);box-shadow:0 12px 44px rgba(0,0,0,.22)}

  @media (max-width:620px){
    .wrap{padding:18px 15px 70px}
    h1.title{font-size:28px}
    .card{padding:22px 18px}
    .axis-explain,.detail-grid,.stat-row{grid-template-columns:1fr}
    .res-badge{width:92px;height:92px}
    .scorerow{grid-template-columns:64px 1fr 30px}
    .distrib .drow{grid-template-columns:62px 1fr 50px}
  }

  /* print */
  @media print{
    body{background:#fff}
    .no-print{display:none !important}
    .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
    .wrap{padding:0;max-width:100%}
  }
</style>
</head>
<body>
  <div class="wrap" id="app"></div>

<script>
/* =========================================================
   DATA — Thomas-Kilmann conflict model (original items)
   ========================================================= */
const MODES = {
  comp:   {key:'comp',  name:'경쟁형', en:'Competing',     color:'var(--m-comp)',   hex:'#E2603F', assert:1,  coop:0,
           tagline:'내 목표를 분명히, 단호하게'},
  collab: {key:'collab',name:'협력형', en:'Collaborating', color:'var(--m-collab)', hex:'#2E9E5B', assert:1,  coop:1,
           tagline:'모두가 이기는 답을 함께'},
  compr:  {key:'compr', name:'타협형', en:'Compromising',  color:'var(--m-compr)',  hex:'#E8A41F', assert:.5, coop:.5,
           tagline:'서로 한 걸음씩, 중간에서'},
  avoid:  {key:'avoid', name:'회피형', en:'Avoiding',      color:'var(--m-avoid)',  hex:'#7E8CA0', assert:0,  coop:0,
           tagline:'지금은 한 발 물러서서'},
  accom:  {key:'accom', name:'수용형', en:'Accommodating', color:'var(--m-accom)',  hex:'#4FA8C9', assert:0,  coop:1,
           tagline:'관계를 위해 기꺼이 맞춰'},
};

/* JSONP: Apps Script GET 응답을 CORS 제약 없이 받기 위함 */
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='tki_cb_'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);
    const sep=url.indexOf('?')===-1?'?':'&';
    const s=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();reject(new Error('timeout'));},15000);
    function cleanup(){clearTimeout(timer);try{delete window[cb];}catch(_){window[cb]=undefined;}if(s.parentNode)s.parentNode.removeChild(s);}
    window[cb]=(data)=>{cleanup();resolve(data);};
    s.onerror=()=>{cleanup();reject(new Error('network'));};
    s.src=url+sep+'callback='+cb;
    document.body.appendChild(s);
  });
}

/* 시트 호출 — fetch(익명) 우선, 실패하면 기존 JSONP로 폴백.
   JSONP는 <script> 태그라 브라우저가 구글 쿠키를 함께 보냅니다. 그래서 구글에
   로그인돼 있으면(특히 계정 여러 개·회사 Workspace 계정) 구글이 요청을 권한
   검사로 넘겨 "현재 파일을 열 수 없습니다" 페이지가 오고 로딩이 실패합니다.
   fetch는 크로스 오리진이라 쿠키를 보내지 않으므로, 로그인 상태와 무관하게
   시크릿 창과 똑같이 익명으로 호출됩니다. (엔드포인트가 CORS 허용 상태) */
function parseApiBody_(text){
  if(typeof text!=='string') return null;
  const t=text.trim();
  if(!t) return null;
  try{ return JSON.parse(t); }catch(_){}
  const a=t.indexOf('('), b=t.lastIndexOf(')');           // JSONP 형태로 와도 벗겨냄
  if(a>0 && b>a){ try{ return JSON.parse(t.slice(a+1,b)); }catch(_){} }
  return null;                                            // HTML 오류 페이지 등
}
async function apiGet_(url){
  let ferr=null;
  if(typeof fetch==='function'){
    let timer=null, ctl=null;
    try{
      if(typeof AbortController==='function'){ ctl=new AbortController(); timer=setTimeout(()=>{try{ctl.abort();}catch(_){}} ,15000); }
      const res=await fetch(url,{method:'GET',credentials:'omit',cache:'no-store',redirect:'follow',signal:ctl?ctl.signal:undefined});
      if(!res || !res.ok) throw new Error('http '+(res?res.status:'?'));
      const data=parseApiBody_(await res.text());
      if(data===null) throw new Error('구글 로그인 상태 때문에 응답이 막힌 것 같아요');
      return data;
    }catch(e){ ferr=e; }
    finally{ if(timer) clearTimeout(timer); }
  }
  try{ return await jsonp(url); }
  catch(e){ throw new Error(ferr ? (ferr.message+' · 재시도도 실패('+e.message+')') : e.message); }
}

const Store = {
  mem:{}, // SHEET_API 미설정 시 로컬 테스트용 임시 저장
  // 저장: JSONP(GET)으로 보내고 서버의 ok 응답으로 성공 여부를 확인합니다
  async save(obj){
    if(!CONFIGURED){ this.mem['k'+obj.id]=JSON.stringify(obj); return true; }
    const p=new URLSearchParams({
      action:'save', key:API_KEY,
      id:obj.id, name:obj.name||'', team:obj.team||'',
      comp:obj.scores.comp, collab:obj.scores.collab, compr:obj.scores.compr,
      avoid:obj.scores.avoid, accom:obj.scores.accom,
      dominant:(obj.dominant||[]).join(','), ts:obj.ts||''
    });
    const data=await apiGet_(SHEET_API+'?'+p.toString());
    if(!data || data.ok!==true) throw new Error((data&&data.error)||'save failed');
    return true;
  },
  async loadAll(){
    if(!CONFIGURED){
      return normList_(Object.values(this.mem).map(v=>JSON.parse(v)));
    }
    const data=await apiGet_(SHEET_API+'?action=list&key='+encodeURIComponent(API_KEY));
    if(!data || data.ok===false) throw new Error((data&&data.error)||'load failed');
    // 중복 제거는 화면에 보이는 범위(세션/날짜)에서만 — 회차가 달라도 동명이인이 지워지지 않도록
    return normList_(Array.isArray(data.results)?data.results:[]);
  },
  async clearAll(){
    if(!CONFIGURED){ this.mem={}; return; }
    try{
      await fetch(SHEET_API,{
        method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'clear',key:API_KEY})
      });
    }catch(e){ console.error('clear',e); }
  }
};
// 시트 한 행을 안전한 형태로 정규화 — 값 하나가 이상해도 화면 전체가 멈추지 않도록
function normRow_(r){
  if(!r || typeof r!=='object') return null;
  if(!r.id && !r.name) return null;
  const num=v=>{ const n=Number(v); return isFinite(n)?n:0; };
  let sc=r.scores;
  if(!sc || typeof sc!=='object'){
    if(r.comp===undefined && r.collab===undefined) return null;
    sc=r;
  }
  const scores={comp:num(sc.comp),collab:num(sc.collab),compr:num(sc.compr),avoid:num(sc.avoid),accom:num(sc.accom)};
  const ts=r.ts||'';
  if(!isFinite(new Date(ts).getTime())) return null;
  return {id:r.id||'', name:r.name||'', team:r.team||'', ts:ts, scores:scores};
}
function normList_(arr){
  const out=[];
  (Array.isArray(arr)?arr:[]).forEach(r=>{ const n=normRow_(r); if(n) out.push(n); });
  return out.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
}

// 같은 사람(이름+회사명)은 가장 최근 제출만 집계에 반영 — 재제출/중복 방지
function dedupeLatest_(arr){
  const map={};
  arr.forEach(r=>{
    if(!r || (!r.id && !r.name)) return;
    const key=(r.name||'')+'\u0000'+(r.team||'');
    const cur=map[key];
    if(!cur || new Date(r.ts) >= new Date(cur.ts)) map[key]=r;
  });
  return Object.values(map).sort((a,b)=>new Date(b.ts)-new Date(a.ts));
}

// ── 진행자 대시보드: 날짜/회사 기준 필터 (데이터는 누적, 보기만 분리) ──
const WDAYS=['일','월','화','수','목','금','토'];
function dayKey(ts){           // 제출 시각 → 현지 날짜 'YYYY-MM-DD'
  const d=new Date(ts), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function dayLabel(key){
  const [y,m,da]=key.split('-').map(Number);
  return `${key} (${WDAYS[new Date(y,m-1,da).getDay()]})`;
}
function uniqueDates_(arr){
  const byDay={};
  (arr||[]).forEach(r=>{ const k=dayKey(r.ts); (byDay[k]=byDay[k]||[]).push(r); });
  return Object.keys(byDay).sort().reverse().map(k=>({key:k,label:dayLabel(k),n:dedupeLatest_(byDay[k]).length}));
}
function uniqueTeams_(arr){
  const cnt={};
  dedupeLatest_(arr||[]).forEach(r=>{ const t=(r.team||'').trim(); if(t) cnt[t]=(cnt[t]||0)+1; });
  const sel=(state.adminTeamFilter||'').trim();
  if(sel && cnt[sel]===undefined) cnt[sel]=0;   // 선택한 회사가 범위 밖이어도 선택 상태는 유지
  return Object.keys(cnt).sort().map(t=>({name:t,n:cnt[t]}));
}

/* =========================================================
   세션(회차) 구분 — 하루 2회차 이상 진행할 때 결과가 섞이지 않게
   · [세션 시작]을 누른 시각 이후의 제출만 그 회차로 봅니다.
   · 세션 표시는 진행자 브라우저(localStorage)에만 저장됩니다. 시트는 건드리지 않아요.
   ========================================================= */
const SESS_KEY='withark_tki_sessions_v1';
const SESS_MAX=40;                 // 오래된 세션 표시는 자동 정리
const SESS_NEAR_MS=30*60*1000;     // '시작 직전' 알림 범위

function loadSessions_(){
  let arr=[];
  try{
    const raw=window.localStorage ? localStorage.getItem(SESS_KEY) : null;
    const parsed=raw?JSON.parse(raw):[];
    if(Array.isArray(parsed)){
      parsed.forEach(x=>{
        if(!x || !x.id || !x.start) return;
        if(!isFinite(new Date(x.start).getTime())) return;
        const end=(x.end && isFinite(new Date(x.end).getTime()))?x.end:null;
        arr.push({id:String(x.id), start:x.start, end:end, label:typeof x.label==='string'?x.label:''});
      });
    }
  }catch(_){ arr=[]; }
  arr.sort((a,b)=>new Date(a.start)-new Date(b.start));
  if(arr.length>SESS_MAX) arr=arr.slice(arr.length-SESS_MAX);
  return arr;
}
function persistSessions_(){
  try{
    let arr=(state.sessions||[]).slice().sort((a,b)=>new Date(a.start)-new Date(b.start));
    if(arr.length>SESS_MAX) arr=arr.slice(arr.length-SESS_MAX);
    state.sessions=arr;
    localStorage.setItem(SESS_KEY, JSON.stringify(arr));
    state.sessionPersistWarn=false;
  }catch(_){ state.sessionPersistWarn=true; }
}
function findSession_(id){
  if(!id) return null;
  const ss=state.sessions||[];
  for(let i=0;i<ss.length;i++){ if(ss[i].id===id) return ss[i]; }
  return null;
}
function activeSession_(){         // 아직 종료하지 않은 세션 (가장 최근 것 하나)
  const ss=(state.sessions||[]).slice().sort((a,b)=>new Date(a.start)-new Date(b.start));
  for(let i=ss.length-1;i>=0;i--){ if(!ss[i].end) return ss[i]; }
  return null;
}
function inSession_(r,s){          // 제출 시각이 [시작, 종료) 안에 있는가
  if(!s) return true;
  const t=new Date(r.ts).getTime();
  if(!isFinite(t)) return false;
  const a=new Date(s.start).getTime();
  const b=s.end?new Date(s.end).getTime():Infinity;
  return t>=a && t<b;
}
function sessionOrdinal_(s){       // 같은 날짜 안에서 몇 회차인지
  const dk=dayKey(s.start);
  const sameDay=(state.sessions||[]).filter(x=>dayKey(x.start)===dk)
                                    .sort((a,b)=>new Date(a.start)-new Date(b.start));
  const i=sameDay.findIndex(x=>x.id===s.id);
  return i<0?1:i+1;
}
function sessionLabel_(s){
  if(!s) return '';
  const d=new Date(s.start), p=n=>String(n).padStart(2,'0');
  const base=`${d.getMonth()+1}/${d.getDate()}(${WDAYS[d.getDay()]}) ${sessionOrdinal_(s)}회차 · ${p(d.getHours())}:${p(d.getMinutes())} 시작`;
  return s.label ? `${s.label} — ${base}` : base;
}
function sessionTag_(s){           // 내보내기 파일명용 — 짧고 안전하게
  const d=new Date(s.start), p=n=>String(n).padStart(2,'0');
  const nm=(s.label||'').replace(/[^0-9A-Za-z가-힣]+/g,'').slice(0,12);
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${sessionOrdinal_(s)}회차`+(nm?'_'+nm:'');
}
function sessionCount_(all,s){     // 그 세션에 포함된 인원 (중복 제출 제외)
  return dedupeLatest_((all||[]).filter(r=>inSession_(r,s))).length;
}
function sessionNearMiss_(all,s){  // 시작 '직전' 제출 — 기기 시계 차이거나 버튼을 늦게 누른 경우
  const a=new Date(s.start).getTime();
  if(!isFinite(a)) return {n:0,names:[]};
  let from=a-SESS_NEAR_MS;
  // 이전 세션이 시작된 시점보다 앞은 보지 않음 (지난 회차 결과까지 끌어오지 않도록)
  const sorted=(state.sessions||[]).slice().sort((x,y)=>new Date(x.start)-new Date(y.start));
  const i=sorted.findIndex(x=>x.id===s.id);
  if(i>0){
    const ps=new Date(sorted[i-1].start).getTime();
    if(isFinite(ps) && ps>from) from=ps;
  }
  if(from>=a) return {n:0,names:[]};
  const hit=(all||[]).filter(r=>{
    const t=new Date(r.ts).getTime();
    return isFinite(t) && t<a && t>=from;
  }).sort((x,y)=>new Date(y.ts)-new Date(x.ts));
  return {n:hit.length, names:hit.slice(0,5).map(r=>r.name||'(이름없음)')};
}

// 세션(또는 날짜)까지만 적용한 범위 — 회사/팀 옵션 계산용
function scopedAdmin_(){
  const all=state.adminResults||[];
  const sess=findSession_(state.adminSessionFilter||'');
  const df=state.adminDateFilter||'';
  if(sess) return all.filter(r=>inSession_(r,sess));
  return all.filter(r=>!df || dayKey(r.ts)===df);
}
function filteredAdmin(){      // 현재 필터가 적용된 결과 (대시보드·CSV 공통)
  const tf=(state.adminTeamFilter||'').trim();
  return dedupeLatest_(scopedAdmin_().filter(r=>!tf || (r.team||'').trim()===tf));
}

// ── 자동 조편성 ──
function shuffle_(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function captureGrpNum(){       // 재렌더 전에 입력한 숫자를 보존
  const el=document.getElementById('grp-num'); if(!el) return;
  const v=Math.max(1, parseInt(el.value,10)||1);
  if((state.groupBy||'count')==='size') state.groupSize=v; else state.groupCount=v;
}
function computeGroups(){
  const people=filteredAdmin(); const N=people.length;
  if(N===0){ state.groups=[]; return; }
  const by=state.groupBy||'count';
  const G = by==='size' ? Math.max(1,Math.ceil(N/Math.max(1,state.groupSize||5)))
                        : Math.max(1,Math.min(state.groupCount||4, N));
  // 대표유형별로 모은 뒤, 유형 안에서 무작위 섞기 (누를 때마다 다르게)
  const buckets={}; MODE_ORDER.forEach(k=>buckets[k]=[]);
  people.forEach(p=>{ buckets[dominantModes(p.scores)[0]].push(p); });
  const ordered=[]; MODE_ORDER.forEach(k=>{ shuffle_(buckets[k]); ordered.push(...buckets[k]); });
  const groups=Array.from({length:G},()=>[]);
  if((state.groupMode||'mix')==='mix') ordered.forEach((p,i)=>groups[i%G].push(p));           // 다양성: 라운드로빈 → 유형 분산
  else                                 ordered.forEach((p,i)=>groups[Math.floor(i*G/N)].push(p)); // 동질: 연속 배분 → 유형 밀집
  state.groups=groups;
}

// 조별 평균 막대 + 미니 좌표
const MIXED_HEX='#6E7A72';   // 복합형(동점) 표시 색 — 전역
function groupStats_(g){
  const n=g.length; if(!n) return '';
  const avg={}; MODE_ORDER.forEach(k=>{ avg[k]=g.reduce((s,p)=>s+(p.scores[k]||0),0)/n; });
  const bars=MODE_ORDER.map(k=>`<div class="gsrow"><span class="gsn" style="color:${MODES[k].hex}">${MODES[k].name}</span><span class="gstrack"><i style="width:${Math.round(avg[k]/12*100)}%;background:${MODES[k].hex}"></i></span><span class="gsv">${avg[k].toFixed(1)}</span></div>`).join('');
  const S=104, PAD=9, inner=S-PAD*2;
  const X=v=>PAD+v*inner, Y=v=>PAD+(1-v)*inner;
  let cAs=0,cCo=0;
  const dots=g.map((p,idx)=>{ const c=centroid(p.scores); cAs+=c.assert; cCo+=c.coop;
    const d=dominantModes(p.scores); const hx=d.length>1?MIXED_HEX:MODES[d[0]].hex;
    const j=(idx%5-2)*0.018;
    return `<circle cx="${X(Math.min(1,Math.max(0,c.coop+j))).toFixed(1)}" cy="${Y(Math.min(1,Math.max(0,c.assert-j))).toFixed(1)}" r="4" fill="${hx}" opacity="0.85"/>`;
  }).join('');
  const gm=`<circle cx="${X(cCo/n).toFixed(1)}" cy="${Y(cAs/n).toFixed(1)}" r="5.5" fill="#1C3A2E" stroke="#fff" stroke-width="1.6"/>`;
  const svg=`<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img" aria-label="조 갈등 좌표">
    <rect x="${PAD}" y="${PAD}" width="${inner}" height="${inner}" fill="#F7F5EF" stroke="#E7E1D4"/>
    <line x1="${PAD+inner/2}" y1="${PAD}" x2="${PAD+inner/2}" y2="${PAD+inner}" stroke="#E7E1D4" stroke-dasharray="2 3"/>
    <line x1="${PAD}" y1="${PAD+inner/2}" x2="${PAD+inner}" y2="${PAD+inner/2}" stroke="#E7E1D4" stroke-dasharray="2 3"/>
    ${dots}${gm}</svg>`;
  return `<div class="gstats"><div class="gsbars">${bars}</div><div class="gsgrid">${svg}<span class="gslabel">조 좌표</span></div></div>`;
}

// ── 진행자 화면 이미지/PDF 내려받기 (프로젝터·슬라이드용) ──
// 캡처 라이브러리는 진행자가 다운로드할 때만 불러옴 (참여자 화면 가볍게)
function loadScript_(src){
  return new Promise((res,rej)=>{
    if([...document.scripts].some(s=>s.src===src)) return res();
    const s=document.createElement('script'); s.src=src; s.onload=()=>res(); s.onerror=()=>rej(new Error('load fail')); document.head.appendChild(s);
  });
}
async function ensureCaptureLibs_(){
  if(typeof html2canvas==='undefined') await loadScript_('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  if(!window.jspdf) await loadScript_('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
}
function exportOverlay_(msg){
  let o=document.getElementById('export-ov');
  if(!o){ o=document.createElement('div'); o.id='export-ov'; o.className='export-ov'; o.innerHTML='<div class="export-box"><div class="spin"></div><span></span></div>'; document.body.appendChild(o); }
  o.querySelector('span').textContent=msg; o.style.display='flex';
  return ()=>{ o.style.display='none'; };
}
// SVG는 html2canvas가 자주 못 그리므로, 캡처 직전 이미지로 변환 후 복원
async function rasterizeSvgs_(root){
  const svgs=[...root.querySelectorAll('svg')]; const restore=[];
  for(const svg of svgs){
    const rect=svg.getBoundingClientRect();
    const w=Math.max(1,Math.round(rect.width)), h=Math.max(1,Math.round(rect.height));
    const clone=svg.cloneNode(true);
    clone.setAttribute('width',w); clone.setAttribute('height',h);
    if(!clone.getAttribute('xmlns')) clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    const xml=new XMLSerializer().serializeToString(clone);
    const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
    let dataUrl;
    try{
      const im=await new Promise((res,rej)=>{ const x=new Image(); x.onload=()=>res(x); x.onerror=rej; x.src=url; });
      const c=document.createElement('canvas'); c.width=w*2; c.height=h*2;
      const ctx=c.getContext('2d'); ctx.scale(2,2); ctx.drawImage(im,0,0,w,h);
      dataUrl=c.toDataURL('image/png');
    }catch(e){ continue; }
    const rimg=document.createElement('img');
    rimg.src=dataUrl; rimg.style.width=w+'px'; rimg.style.height=h+'px'; rimg.style.display='block';
    svg.parentNode.replaceChild(rimg,svg); restore.push([rimg,svg]);
  }
  return ()=>restore.forEach(([r,orig])=>{ if(r.parentNode) r.parentNode.replaceChild(orig,r); });
}
async function captureRoot(){
  const el=app();
  const restoreSvg=await rasterizeSvgs_(el);
  el.classList.add('capturing');
  await new Promise(r=>setTimeout(r,90));
  const maxDim=11000; // 대용량(인원 많음) 시 캔버스 초과로 빈 이미지 나오는 것 방지
  const scale=Math.max(0.5, Math.min(2, maxDim/Math.max(el.scrollWidth, el.scrollHeight)));
  try{
    return await html2canvas(el,{scale, backgroundColor:'#FBF8F1', useCORS:true, logging:false,
      width:el.scrollWidth, height:el.scrollHeight, windowWidth:el.scrollWidth});
  } finally { el.classList.remove('capturing'); restoreSvg(); }
}
function grpTag_(){
  const s=findSession_(state.adminSessionFilter||'');
  const base=s ? sessionTag_(s) : (state.adminDateFilter||'전체');
  return base+(state.adminTeamFilter?'_'+state.adminTeamFilter:'');
}

  if(state.exporting) return; state.exporting=true;

}
async function downloadPdf(){

  const done=exportOverlay_('PDF 생성 중…');

    pdf.save('갈등관리_집계_'+grpTag_()+'.pdf');
  }catch(e){ console.error(e); alert('PDF 저장 중 문제가 발생했어요. 인원이 아주 많으면 날짜·회사 필터로 대상을 좁힌 뒤 다시 시도해 주세요.'); }
  finally{ done(); state.exporting=false; }

async function ensurePptxLib_(){
  if(!window.PptxGenJS) await loadScript_('https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js');
}
// 각 항목(카드)을 슬라이드 한 장씩으로 만든 PPT — 필요한 장만 골라 쓰기 좋게. 조편성은 편성했을 때만 별도 장.
async function downloadPptx(){
  if(state.exporting) return; state.exporting=true;
  const done=exportOverlay_('PPT 생성 중… (항목별로 나눠요)');
  const el=app(); let restoreSvg=null;
  try{
    await ensureCaptureLibs_(); await ensurePptxLib_();
    const Pptx=window.PptxGenJS;
    if(!Pptx) throw new Error('pptx lib');
    restoreSvg=await rasterizeSvgs_(el);
    el.classList.add('capturing');
    await new Promise(r=>setTimeout(r,90));
    // 대상 카드: 조편성 카드는 실제로 편성됐을 때만 포함
    const cards=[...el.querySelectorAll('.card')].filter(c=>{
      const isGroup=c.querySelector('.grp-controls');
      return !(isGroup && !c.querySelector('.groups'));
    });
    const pptx=new Pptx();
    pptx.defineLayout({name:'WA', width:13.33, height:7.5}); pptx.layout='WA';
    const maxW=12.3, maxH=6.4;
    const SLIDE_AR=maxW/maxH;                 // 16:9 슬라이드 비율
    for(const card of cards){
      // 카드가 세로로 길면 캡처 폭을 넓혀 가로 화면에 맞춘다
      const natW=card.offsetWidth, natH=card.offsetHeight;
      let capW=natW;
      if(natH>0 && natW/natH < SLIDE_AR){
        capW=Math.min(2600, Math.round(natH*SLIDE_AR));   // 가로로 펴기
      }
      const prevW=card.style.width, prevMax=card.style.maxWidth;
      if(capW!==natW){ card.style.width=capW+'px'; card.style.maxWidth='none'; await new Promise(r=>setTimeout(r,60)); }
      let canvas;
      try{
        canvas=await html2canvas(card,{scale:2, backgroundColor:'#FFFFFF', useCORS:true, logging:false,
          width:card.offsetWidth, height:card.offsetHeight, windowWidth:card.offsetWidth});
      } finally {
        if(capW!==natW){ card.style.width=prevW; card.style.maxWidth=prevMax; }
      }
      const aspect=canvas.width/canvas.height;
      let w=maxW, h=w/aspect; if(h>maxH){ h=maxH; w=h*aspect; }
      const slide=pptx.addSlide(); slide.background={color:'FBF8F1'};
      slide.addImage({ data:canvas.toDataURL('image/png'), x:(13.33-w)/2, y:(7.5-h)/2, w, h });
    }
    await pptx.writeFile({ fileName:'갈등관리_집계_'+grpTag_()+'.pptx' });
  }catch(e){ console.error(e); alert('PPT 저장 중 문제가 발생했어요. 잠시 후 다시 시도해 주세요.'); }
  finally{ el.classList.remove('capturing'); if(restoreSvg) restoreSvg(); done(); state.exporting=false; }
}

/* =========================================================
   SCORING
   ========================================================= */
function computeScores(answers){
  const s={comp:0,collab:0,compr:0,avoid:0,accom:0};
  answers.forEach((ch,i)=>{
    if(!ch) return;
    const m=Q[i][ch].m; s[m]++;
  });
  return s;
}
function dominantModes(scores){
  const max=Math.max(...MODE_ORDER.map(k=>scores[k]));
  return MODE_ORDER.filter(k=>scores[k]===max);
}
function centroid(scores){ // -> {assert, coop} 0..1
  let total=0, a=0, c=0;
  MODE_ORDER.forEach(k=>{ const v=scores[k]; total+=v; a+=v*MODES[k].assert; c+=v*MODES[k].coop; });
  if(total===0) return {assert:.5,coop:.5};
  return {assert:a/total, coop:c/total};
}
function flexibilityLabel(scores){
  // spread of the 5 scores: lower spread -> more flexible
  const vals=MODE_ORDER.map(k=>scores[k]);
  const mean=vals.reduce((x,y)=>x+y,0)/5;
  const variance=vals.reduce((x,y)=>x+(y-mean)**2,0)/5;
  const sd=Math.sqrt(variance);
  if(sd<=1.6) return {t:'균형형', d:'다섯 가지 방식을 고르게 사용해요. 상황에 따라 유연하게 갈등을 다룰 수 있는 강점이 있습니다.'};
  if(sd<=2.8) return {t:'복합형', d:'주된 방식이 있지만 다른 방식도 함께 쓰는 편이에요. 상황별로 의식해서 활용하면 더 유연해집니다.'};
  return {t:'집중형', d:'특정 방식에 크게 의존하는 편이에요. 잘 안 쓰는 접근을 의도적으로 연습하면 갈등 대응의 폭이 넓어집니다.'};
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){
  const d=new Date(iso);
  const p=n=>String(n).padStart(2,'0');
  return `${d.getMonth()+1}.${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* conflict grid SVG. points:[{assert,coop,hex,r,strong}] */
function gridSVG(points, showCornerDots){
  const W=360,H=360, m=46, inner=W-m*2;
  const X=c=>m+c*inner, Y=a=>m+(1-a)*inner;
  const corners=[
    {k:'comp',   x:X(0),y:Y(1)}, {k:'collab', x:X(1),y:Y(1)},
    {k:'avoid',  x:X(0),y:Y(0)}, {k:'accom',  x:X(1),y:Y(0)},
    {k:'compr',  x:X(.5),y:Y(.5)},
  ];
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="갈등 대응 좌표">`;
  s+=`<rect x="${m}" y="${m}" width="${inner}" height="${inner}" rx="14" fill="#FBFAF6" stroke="#E7E1D4"/>`;
  // quadrant guides
  s+=`<line x1="${X(.5)}" y1="${m}" x2="${X(.5)}" y2="${m+inner}" stroke="#ECE6D8" stroke-dasharray="4 5"/>`;
  s+=`<line x1="${m}" y1="${Y(.5)}" x2="${m+inner}" y2="${Y(.5)}" stroke="#ECE6D8" stroke-dasharray="4 5"/>`;
  // axis labels
  s+=`<text x="${m-14}" y="${m+12}" font-size="12" font-weight="700" fill="#4A5D52" transform="rotate(-90 ${m-14} ${m+12})" text-anchor="end">자기주장 높음 ↑</text>`;
  s+=`<text x="${m-14}" y="${m+inner}" font-size="11" fill="#9aa297" transform="rotate(-90 ${m-14} ${m+inner})" text-anchor="start">자기주장 낮음</text>`;
  s+=`<text x="${m}" y="${m+inner+26}" font-size="11" fill="#9aa297" text-anchor="start">협력 낮음</text>`;
  s+=`<text x="${m+inner}" y="${m+inner+26}" font-size="12" font-weight="700" fill="#4A5D52" text-anchor="end">협력 높음 →</text>`;
  // corner mode labels (+ faint reference dots)
  corners.forEach(c=>{
    const md=MODES[c.k];
    if(showCornerDots){
      s+=`<circle cx="${c.x}" cy="${c.y}" r="6" fill="${md.hex}" opacity="0.22"/>`;
    }
    let lx=c.x, ly=c.y, anchor='middle', dy=0;
    if(c.k==='comp'){ ly=c.y-13; }
    if(c.k==='collab'){ ly=c.y-13; }
    if(c.k==='avoid'){ ly=c.y+22; }
    if(c.k==='accom'){ ly=c.y+22; }
    if(c.k==='compr'){ ly=c.y-12; }
    s+=`<text x="${lx}" y="${ly}" font-size="11.5" font-weight="700" fill="${md.hex}" text-anchor="${anchor}">${md.name}</text>`;
  });
  // plotted points
  points.forEach(p=>{
    const px=X(p.coop), py=Y(p.assert), r=p.r||9;
    const tip=p.label?`<title>${esc(p.label)}</title>`:'';
    if(p.strong){
      s+=`<circle cx="${px}" cy="${py}" r="${r+7}" fill="${p.hex}" opacity="0.16"/>`;
      s+=`<circle cx="${px}" cy="${py}" r="${r}" fill="${p.hex}" stroke="#fff" stroke-width="2.5">${tip}</circle>`;
    }else{
      s+=`<circle cx="${px}" cy="${py}" r="${r}" fill="${p.hex}" opacity="${p.op||0.85}" stroke="#fff" stroke-width="1.5">${tip}</circle>`;
    }
  });
  s+=`</svg>`;
  return s;
}

      <span class="sdesc">시작 이후 제출 <b>${n}명</b>${viewing?'':' · 지금 화면은 이 세션이 아니에요'}</span>
      <span class="sgrow">
        ${viewing?'':`<button class="btn-mini" data-action="sessionView" data-sid="${esc(act.id)}">이 세션 보기</button>`}

        <button class="btn-mini" data-action="sessionNudge" data-min="5">시작 +5분</button>
        <button class="btn-mini" data-action="sessionEnd">세션 종료</button>
        <button class="btn-mini" data-action="sessionStart">새 회차 시작</button>
      </span>
      ${near.n?`<div class="sessnote warn">시작 <b>직전 30분</b> 사이 제출 ${near.n}건${nearWho}. 이 회차 참여자가 먼저 시작했거나 기기 시계가 어긋난 것일 수 있어요 — 이 회차 사람이라면 <b>시작 −5분</b>을 눌러 포함시키세요.</div>`:''}
      ${persistWarn}
    </div>`;
  }

  return `<div class="sessbar no-print">
    <span class="stitle">세션(회차) 구분</span>
    <span class="sdesc">하루에 2회차 이상 진행할 때, <b>회차를 시작하기 직전</b>에 눌러 두면 그 이후 제출만 따로 볼 수 있어요.</span>
    <span class="sgrow"><button class="btn btn-primary" data-action="sessionStart" style="padding:8px 16px">세션 시작</button></span>
    ${ss.length?`<div class="sessnote">지난 세션 ${ss.length}개는 아래 <b>세션</b> 필터에서 다시 볼 수 있어요. 세션 표시는 <b>이 브라우저에만</b> 저장되니, 진행자 노트북을 바꾸면 새로 시작해 주세요.</div>`:''}
    ${persistWarn}
  </div>`;
}

function vAdminDash(){
  if(state.adminLoading){
    return `${brandbar()}
    <div class="card"><div class="loader"><span class="spin"></span> 참여자 결과를 불러오는 중…</div></div>${footer()}`;

  const ALL=state.adminResults||[];
  const R=filteredAdmin();

    <div class="card">
      <div class="empty">
        <b>결과를 불러올 수 없어요</b>
        ${esc(state.adminError)}
      </div>
      ${CONFIGURED?`<div class="insight" style="margin-top:2px">
        <h4>가장 흔한 원인부터</h4>
        <p><b>① 브라우저의 구글 로그인 상태</b> — 구글 계정이 여러 개 로그인돼 있거나 회사(Workspace) 계정이면,
           구글이 요청을 권한 검사로 넘겨 실패합니다. 시크릿 창에서는 되는데 평소 브라우저에서만 안 된다면 거의 이 경우예요.<br>
           → 계정을 하나만 남기고 로그아웃하거나, <b>구글에 로그인하지 않은 Chrome 프로필</b>로 접속해 보세요.</p>
        <p><b>② 광고·추적 차단 확장 프로그램</b> — 이 사이트에서 잠시 꺼 보세요.</p>
        <p><b>③ 배포 설정</b> — <code>SHEET_API</code>가 <code>.../exec</code>로 끝나는지, 액세스 권한이 "모든 사용자"인지,
           코드를 고쳤다면 새 버전으로 재배포했는지 확인하세요.</p>
        <p style="margin-top:10px"><button class="linkbtn" data-action="apiSelfTest">시트 연결 직접 확인하기</button>
           — 새 탭에서 서버 응답을 그대로 봅니다. <code>{"ok":true...}</code>가 보이면 서버는 정상이고 ①②가 원인입니다.</p>
      </div>`:''}
    </div>
    ${toolbar}${footer()}`;
  }

  if(ALL.length===0){
    return `${head}
    ${sessBar}
    <div class="card">
      <div class="empty">
        <b>아직 모인 결과가 없어요</b>
        참여자가 진단을 완료하면 이곳에 자동으로 집계됩니다.<br>같은 링크를 팀원들에게 공유해 주세요.
      </div>
    </div>
    ${toolbar}${footer()}`;
  }

  // ── 세션·날짜·회사 필터 UI ──
  const sf=state.adminSessionFilter||'';
  const curSess=findSession_(sf);
  const sessList=(state.sessions||[]).slice().sort((a,b)=>new Date(b.start)-new Date(a.start));
  const fdates=uniqueDates_(ALL), fteams=uniqueTeams_(scopedAdmin_());
  const df=state.adminDateFilter||'', tf=state.adminTeamFilter||'';
  const sessOpts=`<option value="">세션 미적용 (날짜로 보기)</option>`+sessList.map(x=>
    `<option value="${esc(x.id)}"${sf===x.id?' selected':''}>${esc(sessionLabel_(x))}${x.end?'':' · 진행중'} · ${sessionCount_(ALL,x)}명</option>`).join('');
  const dateOpts=`<option value="">전체 기간</option>`+fdates.map(d=>`<option value="${d.key}"${df===d.key?' selected':''}>${d.label} · ${d.n}명</option>`).join('');
  const teamOpts=`<option value="">전체 회사/팀</option>`+fteams.map(t=>`<option value="${esc(t.name)}"${tf===t.name?' selected':''}>${esc(t.name)} · ${t.n}명</option>`).join('');
  const filterBar=`<div class="filterbar no-print">
    ${sessList.length?`<label>세션 <select data-filter="session">${sessOpts}</select></label>`:''}
    ${curSess?`<span class="muted small"><button class="linkbtn" data-action="sessionRename" data-sid="${esc(curSess.id)}">이름</button> · <button class="linkbtn" data-action="sessionDelete" data-sid="${esc(curSess.id)}">표시 삭제</button></span>`:''}
    <label>날짜 <select data-filter="date"${curSess?' disabled':''}>${dateOpts}</select></label>
    <label>회사/팀 <select data-filter="team">${teamOpts}</select></label>
    <span class="fcount">${R.length}명 표시${(df||tf||sf)?` · <button class="linkbtn" data-action="filterReset">필터 해제</button>`:''}</span>
    ${curSess?`<div style="flex:1 1 100%;color:var(--ink-soft);font-weight:600;font-size:12.5px">세션이 선택돼 있어 <b>날짜 필터는 잠시 꺼져</b> 있어요 — 세션 시작 시각이 기준입니다.</div>`:''}
  </div>`;
  const filterDesc=curSess
    ? `${esc(sessionLabel_(curSess))}${tf?' · '+esc(tf):''}`
    : `${df?dayLabel(df):'전체 기간'}${tf?' · '+esc(tf):''}`;

  if(R.length===0){
    return `${head}
    ${sessBar}
    ${filterBar}
    <div class="card"><div class="empty"><b>선택한 조건에 결과가 없어요</b>${curSess?'이 세션은 <b>시작 시각 이후</b> 제출만 모아요. 참여자가 아직 제출하지 않았거나, 세션 시작 버튼을 늦게 눌렀을 수 있어요.':'다른 날짜나 회사/팀을 고르거나 필터를 해제해 보세요.'}</div></div>
    ${toolbar}${footer()}`;
  }

  // aggregate
  const N=R.length;
  const avg={}; MODE_ORDER.forEach(k=>avg[k]=0);
  const distrib={}; MODE_ORDER.forEach(k=>distrib[k]=0);
  const domCount={}; MODE_ORDER.forEach(k=>domCount[k]=0); // 동점 포함, 유형별 등장 인원
  let mixedCnt=0; // 대표 유형이 2개 이상(동점)인 참여자 수
  R.forEach(r=>{
    MODE_ORDER.forEach(k=>avg[k]+=(r.scores[k]||0));
    const ds=dominantModes(r.scores);
    ds.forEach(k=>domCount[k]++);
    if(ds.length===1) distrib[ds[0]]++; else mixedCnt++;
  });
  MODE_ORDER.forEach(k=>avg[k]=avg[k]/N);
  const teamCentroid=centroid(Object.fromEntries(MODE_ORDER.map(k=>[k,avg[k]])));

  // stats
  const distinctDom=MODE_ORDER.filter(k=>domCount[k]>0).length;
  const topTeamMode=MODE_ORDER.slice().sort((a,b)=>avg[b]-avg[a])[0];
  const stats=`<div class="stat-row">
    <div class="stat"><div class="num">${N}</div><div class="lab">참여 인원</div></div>
    <div class="stat"><div class="num" style="color:${MODES[topTeamMode].hex}">${MODES[topTeamMode].name}</div><div class="lab">팀 평균 최다 유형</div></div>
    <div class="stat"><div class="num">${distinctDom}<span style="font-size:16px;color:var(--ink-soft)">/5</span></div><div class="lab">분포된 유형 수</div></div>
  </div>`;

  // distribution bars (people count by dominant)
  let distRows=MODE_ORDER.slice().sort((a,b)=>distrib[b]-distrib[a]).map(k=>{
    const md=MODES[k], cnt=distrib[k], w=Math.round((cnt/N)*100);
    return `<div class="drow">
      <div class="nm" style="color:${md.hex}">${md.name}</div>
      <div class="track"><i style="width:${Math.max(w,cnt?6:0)}%;background:${md.hex}"></i></div>
      <div class="cnt">${cnt}명 · ${w}%</div>
    </div>`;
  }).join('');
  if(mixedCnt>0){
    const w=Math.round((mixedCnt/N)*100);
    distRows+=`<div class="drow">
      <div class="nm" style="color:${MIXED_HEX}">복합형(동점)</div>
      <div class="track"><i style="width:${Math.max(w,6)}%;background:${MIXED_HEX}"></i></div>
      <div class="cnt">${mixedCnt}명 · ${w}%</div>
    </div>`;
  }

  // team avg bars
  const avgRows=MODE_ORDER.map(k=>{
    const md=MODES[k], v=avg[k], w=Math.round((v/12)*100);
    return `<div class="scorerow">
      <div class="nm" style="color:${md.hex}">${md.name}</div>
      <div class="track"><i style="width:${w}%;background:${md.hex}"></i></div>
      <div class="vv">${v.toFixed(1)}</div>
    </div>`;
  }).join('');

  // team constellation grid
  const pts=R.map((r,idx)=>{
    const c=centroid(r.scores);
    const ds=dominantModes(r.scores);
    const tie=ds.length>1;
    const hex=tie?MIXED_HEX:MODES[ds[0]].hex;
    const typ=tie?('복합형: '+ds.map(x=>MODES[x].name).join('·')):MODES[ds[0]].name;
    // small deterministic jitter to reduce overlap
    const j=(idx%7-3)*0.012;
    return {assert:Math.min(1,Math.max(0,c.assert+j)),coop:Math.min(1,Math.max(0,c.coop-j)),hex,r:6.5,op:0.8,label:(r.name||'참여자')+(r.team?' ('+r.team+')':'')+' · '+typ};
  });
  pts.push({assert:teamCentroid.assert,coop:teamCentroid.coop,hex:'#1C3A2E',strong:true,r:9,label:'팀 평균 위치'});
  const grid=gridSVG(pts,false);

  // insights
  const ins=teamInsights(R,avg,domCount,N,topTeamMode);

  // table
  const rows=R.map(r=>{
    const d=dominantModes(r.scores);
    const pillHex=d.length>1?MIXED_HEX:MODES[d[0]].hex;
    const cells=MODE_ORDER.map(k=>{
      const isTop=d.includes(k);
      return `<td class="num-cell ${isTop?'top':''}">${r.scores[k]||0}</td>`;
    }).join('');
    return `<tr>
      <td>${esc(r.name)}</td>
      <td class="muted">${r.team?esc(r.team):'—'}</td>
      <td><span class="pill" style="color:${pillHex}"><span class="dot" style="background:${pillHex}"></span>${d.map(x=>MODES[x].name).join('·')}</span></td>
      ${cells}
      <td class="muted small">${fmtDate(r.ts)}</td>
    </tr>`;
  }).join('');

  const gm=state.groupMode||'mix', gb=state.groupBy||'count';
  const groupsOut=(state.groups&&state.groups.length)?`<div class="groups">${state.groups.map((g,i)=>{
    const comp={}; let mixedN=0; g.forEach(p=>{const d=dominantModes(p.scores); if(d.length>1) mixedN++; else comp[d[0]]=(comp[d[0]]||0)+1;});
    const chips=MODE_ORDER.filter(k=>comp[k]).map(k=>`<span class="gchip" style="background:${MODES[k].hex}1a;color:${MODES[k].hex}">${MODES[k].name} ${comp[k]}</span>`).join('')+(mixedN?`<span class="gchip" style="background:${MIXED_HEX}1a;color:${MIXED_HEX}">복합 ${mixedN}</span>`:'');
    return `<div class="grp"><div class="grp-head">${i+1}조 <span class="muted">· ${g.length}명</span></div><div class="grp-comp">${chips}</div>${g.map(p=>{const d=dominantModes(p.scores);const hx=d.length>1?MIXED_HEX:MODES[d[0]].hex;return `<div class="grp-row"><span class="dot" style="background:${hx}"></span><span class="gn">${esc(p.name)}</span>${p.team?`<span class="gt muted">${esc(p.team)}</span>`:''}<span class="gtype" style="color:${hx}">${d.map(x=>MODES[x].name).join('·')}</span></div>`;}).join('')}${groupStats_(g)}</div>`;
  }).join('')}</div>`:`<p class="muted small" style="margin-top:6px">방식·기준을 고르고 <b>조 편성</b>을 누르면 자동으로 나눠져요.</p>`;
  const groupCard=`<div class="card">
    <div class="eyebrow">자동 조편성</div>
    <h2 class="sec" style="margin-top:8px">조 나누기</h2>
    <p class="muted small" style="margin:6px 0 0">지금 화면에 보이는 <b>${N}명</b> 기준이에요 (위 날짜·회사 필터 적용). 다양성 조는 각 조에 유형이 골고루 섞이도록 배정합니다.</p>
    <div class="grp-controls no-print">
      <span class="glabel">방식</span>
      <span class="seg">
        <button class="${gm==='mix'?'on':''}" data-action="grpModeMix">다양성 섞기</button>
        <button class="${gm==='match'?'on':''}" data-action="grpModeMatch">동질 모으기</button>
      </span>
      <span class="glabel">기준</span>
      <span class="seg">
        <button class="${gb==='count'?'on':''}" data-action="grpByCount">조 개수</button>
        <button class="${gb==='size'?'on':''}" data-action="grpBySize">조당 인원</button>
      </span>
      <input id="grp-num" class="grp-num" type="number" min="1" value="${gb==='size'?(state.groupSize||5):(state.groupCount||4)}">
      <span class="muted small">${gb==='size'?'명씩':'개 조'}</span>
      <button class="btn btn-primary" data-action="makeGroups" style="padding:8px 16px">조 편성</button>
      ${(state.groups&&state.groups.length)?`<button class="btn btn-ghost" data-action="makeGroups" style="padding:8px 14px">다시 섞기</button>`:''}
    </div>
    ${groupsOut}
  </div>`;

  const pubToggle=`<div class="pubtoggle no-print">
    <button class="btn ${state.publicMode?'btn-primary':'btn-ghost'}" data-action="togglePublic">${state.publicMode?'공개용(익명) 화면 해제':'공개용(익명) 화면으로 보기'}</button>
    <span class="muted small">${state.publicMode?'지금은 익명 화면 — 이름·개인표·조편성이 숨겨져 프로젝터에 띄우기 안전해요.':'켜면 이름·개인표·조편성을 숨기고 팀 전체 지형(분포·좌표·인사이트)만 보여줘요.'}</span>
  </div>`;

  return `${head}
  ${sessBar}
  ${filterBar}
  ${pubToggle}
  <div class="card">
    <div class="eyebrow">진행자 집계</div>
    <h2 class="sec" style="margin-top:8px">팀 갈등관리 대시보드</h2>
    <p class="muted small" style="margin:6px 0 16px"><b>${filterDesc}</b> · 총 ${N}명의 결과를 종합했어요.</p>
    ${stats}
  </div>
  ${state.publicMode?'':groupCard}

  <div class="card">
    <h2 class="sec">대표 유형 분포</h2>
    <p class="muted small" style="margin:6px 0 14px">각 참여자의 가장 높은 유형 기준 인원수예요. 최고점이 여러 유형에서 같게 나온 참여자는 <b>복합형(동점)</b>으로 따로 셉니다 (합계 = 참여 인원).</p>
    <div class="distrib">${distRows}</div>
  </div>

  <div class="card">
    <h2 class="sec">팀 평균 점수</h2>
    <p class="muted small" style="margin:6px 0 14px">유형별 12점 만점, 팀 전체 평균입니다. <b>참고</b> — 강제 선택 방식이라 점수는 개인 안에서의 상대값이에요. 사람 간 평균은 정밀한 수치라기보다 <b>대략적 경향</b>으로 봐 주세요.</p>
    <div class="scorelist">${avgRows}</div>
  </div>

  <div class="card">
    <h2 class="sec">팀 갈등 좌표</h2>
    <p class="muted small" style="margin:6px 0 10px">점 하나가 참여자 한 명, 진한 점이 팀 평균 위치예요. 한쪽에 몰려 있는지 고르게 퍼져 있는지 살펴보세요.</p>
    <div class="gridwrap">${grid}</div>
  </div>

  <div class="card">
    <h2 class="sec">팀 인사이트</h2>
    <div class="insight">
      <h4>지금 우리 팀은</h4>
      ${ins.map(p=>`<p>${p}</p>`).join('')}
    </div>
    <h2 class="sec" style="margin-top:22px;font-size:17px">워크숍 토론 질문</h2>
    <div class="guide-q">
      <div class="gq"><b>1</b>내 대표 유형이 잘 통했던 갈등 상황과, 오히려 어려웠던 상황은 언제였나요?</div>
      <div class="gq"><b>2</b>우리 팀에 가장 부족한 방식은 무엇일까요? 그게 없어서 생긴 일이 있었나요?</div>
      <div class="gq"><b>3</b>나와 정반대 유형인 동료의 강점을 한 가지씩 찾아 말해 볼까요?</div>
      <div class="gq"><b>4</b>다음에 팀 안에서 갈등이 생기면, 우리는 어떤 방식을 더 의식적으로 써 보면 좋을까요?</div>
    </div>
  </div>

  ${state.publicMode?'':`<div class="card">
    <h2 class="sec">참여자별 상세</h2>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>이름</th><th>회사명/팀</th><th>대표 유형</th>
          <th style="text-align:center">경쟁</th><th style="text-align:center">협력</th>
          <th style="text-align:center">타협</th><th style="text-align:center">회피</th>
          <th style="text-align:center">수용</th><th>응답 시각</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`}

  ${toolbar}${footer()}`;
}

function teamInsights(R,avg,distrib,N,topMode){
  const out=[];
  const ratio=k=>distrib[k]/N;
  const lowest=MODE_ORDER.slice().sort((a,b)=>avg[a]-avg[b])[0];
  const distinctDom=MODE_ORDER.filter(k=>distrib[k]>0).length;

  // headline by top team mode
  const headMap={
    comp:'팀 전반에 <b>경쟁형</b> 성향이 두드러져요. 추진력과 결단은 강하지만, 힘겨루기나 소통 단절이 생기지 않게 서로의 입장을 충분히 듣는 장치가 필요합니다.',
    collab:'팀 전반에 <b>협력형</b> 성향이 강해요. 함께 더 나은 답을 찾으려는 좋은 토양이 있습니다. 다만 모든 사안을 깊게 다루다 지치지 않도록, 사안의 크기에 맞게 속도를 조절해 보세요.',
    compr:'팀 전반이 <b>타협형</b>에 익숙해요. 빠르고 공정한 결론에 강하지만, 절반에서 멈추느라 더 나은 통합적 해법을 놓치고 있지 않은지 가끔 점검할 필요가 있어요.',
    avoid:'팀 전반에 <b>회피형</b> 성향이 높게 나타나요. 불필요한 충돌은 줄지만, 미뤄 둔 갈등이 곪을 수 있어요. 갈등을 안전하게 꺼내 놓는 자리를 의도적으로 만들어 보세요.',
    accom:'팀 전반에 <b>수용형</b> 성향이 강해요. 화합과 배려가 큰 강점입니다. 다만 솔직한 이견이 묻히지 않도록, 반대 의견을 환영하는 분위기를 함께 만들어 가면 좋겠어요.',
  };
  out.push(headMap[topMode]);

  // balance / concentration
  if(distinctDom<=2){
    out.push('대표 유형이 <b>한두 가지에 쏠려</b> 있어요. 비슷한 방식만 쓰면 같은 갈등에서 같은 한계에 부딪히기 쉽습니다. 부족한 접근을 보완할 역할을 의식적으로 정해 보세요.');
  }else if(distinctDom>=4){
    out.push('다섯 유형이 <b>고루 분포</b>해 있어요. 서로 다른 강점이 모여 있다는 뜻이라, 차이를 이해하기만 하면 갈등을 다루는 폭이 넓고 시너지가 큽니다.');
  }

  // specific flags
  if(topMode!=='collab' && avg.collab===Math.min(...MODE_ORDER.map(k=>avg[k]))){
    out.push('상대적으로 <b>협력형 사용이 가장 낮아요.</b> 모두의 관심사를 함께 푸는 경험이 적다는 신호일 수 있어요. 한 가지 사안만이라도 win-win을 목표로 깊이 다뤄 보는 연습을 권합니다.');
  }
  if(ratio('avoid')>=0.34 && topMode!=='avoid'){
    out.push('회피형 비중도 적지 않아요(약 '+Math.round(ratio('avoid')*100)+'%). 표면적으로 조용해 보여도 속에 남은 이슈가 있을 수 있으니, 익명으로라도 의견을 모아 보면 좋아요.');
  }
  return out;
}

function footer(){
  return `<div class="footnote no-print">
    토마스–킬만 갈등관리 모델(자기주장 × 협력, 5가지 유형)을 바탕으로 위드아크가 자체 제작한 진단 도구입니다.<br>
    워크숍 진행·문의 : 위드아크 WithArk · 010-4537-2382
  </div>`;
}

/* =========================================================
   ACTIONS
   ========================================================= */
function go(screen){ state.screen=screen; render(); }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  if(!t) return;
  const a=t.getAttribute('action')||t.dataset.action;
  const action=t.dataset.action;
  switch(action){
    case 'start': go('info'); break;
    case 'toGuide': go('guide'); break;
    case 'toInfo': go('info'); break;
    case 'backHome': resetQuiz(); state.adminAuthed=false; go('home'); break;

    case 'beginQuiz': {
      const nm=document.getElementById('f-name').value.trim();
      const tm=document.getElementById('f-team').value.trim();
      if(!nm || !tm){ const el=document.getElementById('info-err'); if(el) el.style.display='block'; return; }
      state.name=nm; state.team=tm;
      state.qIndex=0; state.answers=new Array(Q.length).fill(null);
      go('quiz'); break;
    }
    case 'answer': {
      state.answers[state.qIndex]=t.dataset.choice;
      render(); break;
    }
    case 'prev': {
      if(state.qIndex===0){ go('info'); }
      else { state.qIndex--; render(); }
      break;
    }
    case 'next': {
      if(!state.answers[state.qIndex]) return;
      if(state.qIndex<Q.length-1){ state.qIndex++; render(); }
      else { finishQuiz(); }
      break;
    }
    case 'restart': resetQuiz(); go('home'); break;

    case 'openAdmin':
      if(state.adminAuthed){ openAdminDash(); }
      else { state.pwError=''; go('adminLogin'); }
      break;
    case 'adminAuth': {
      const pw=document.getElementById('f-pw').value;
      if(pw===ADMIN_PASS){ state.adminAuthed=true; state.pwError=''; openAdminDash(); }
      else { state.pwError='비밀번호가 일치하지 않아요.'; render(); }
      break;
    }
    case 'adminLogout': state.adminAuthed=false; state.pwError=''; state.adminResults=[];
      state.adminSessionFilter=undefined; state.adminDateFilter=undefined; state.adminTeamFilter='';
      state.groups=null; go('adminLogin'); break;
    case 'adminRefresh': openAdminDash(); break;
    case 'apiSelfTest': window.open(SHEET_API+'?action=list&key='+encodeURIComponent(API_KEY),'_blank','noopener'); break;
    case 'adminClear': onAdminClear(); break;
    case 'exportCsv': exportCsv(); break;
    case 'printPage': window.print(); break;
    case 'retrySave': saveResult(); break;
    case 'filterReset': state.adminDateFilter=''; state.adminTeamFilter=''; state.adminSessionFilter=''; state.groups=null; render(); break;
    case 'sessionStart': sessionStart(); break;
    case 'sessionEnd': sessionEnd(); break;
    case 'sessionNudge': sessionNudge(parseInt(t.dataset.min,10)||0); break;
    case 'sessionView': state.adminSessionFilter=t.dataset.sid||''; state.adminTeamFilter=''; state.groups=null; render(); break;
    case 'sessionRename': sessionRename(t.dataset.sid); break;
    case 'sessionDelete': sessionDelete(t.dataset.sid); break;
    case 'grpModeMix': captureGrpNum(); state.groupMode='mix'; if(state.groups&&state.groups.length)computeGroups(); render(); break;
    case 'grpModeMatch': captureGrpNum(); state.groupMode='match'; if(state.groups&&state.groups.length)computeGroups(); render(); break;
    case 'grpByCount': captureGrpNum(); state.groupBy='count'; if(state.groups&&state.groups.length)computeGroups(); render(); break;
    case 'grpBySize': captureGrpNum(); state.groupBy='size'; if(state.groups&&state.groups.length)computeGroups(); render(); break;
    case 'makeGroups': captureGrpNum(); computeGroups(); render(); break;
    case 'downloadImage': downloadImage(); break;
    case 'downloadPptx': downloadPptx(); break;
    case 'togglePublic': state.publicMode=!state.publicMode; render(); break;
  }
});

// allow Enter to submit name / password
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  if(state.screen==='info'){ const b=document.querySelector('[data-action="beginQuiz"]'); if(b) b.click(); }
  if(state.screen==='adminLogin'){ const b=document.querySelector('[data-action="adminAuth"]'); if(b) b.click(); }
});

// 진행자 대시보드 날짜·회사 필터 변경
document.addEventListener('change',e=>{
  const sel=e.target.closest('[data-filter]');
  if(!sel) return;
  const f=sel.getAttribute('data-filter');
  if(f==='session'){ state.adminSessionFilter=sel.value; state.adminTeamFilter=''; }
  if(f==='date') state.adminDateFilter=sel.value;
  if(f==='team') state.adminTeamFilter=sel.value;
  state.groups=null;
  render();
});

function resetQuiz(){
  state.name=''; state.team=''; state.qIndex=0;
  state.answers=new Array(Q.length).fill(null); state.lastResult=null;
}

function finishQuiz(){
  const scores=computeScores(state.answers);
  const result={
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    name:state.name, team:state.team,
    scores, dominant:dominantModes(scores),
    ts:new Date().toISOString()
  };
  state.lastResult=result;
  state.saveState = CONFIGURED ? 'saving' : 'local';
  go('result');               // 결과는 즉시 표시
  if(CONFIGURED) saveResult(); // 저장은 백그라운드 + 성공 확인
}

// 저장 + 서버 확인 + 1회 자동 재시도
async function saveResult(){
  setSaveState('saving');
  try{
    await Store.save(state.lastResult);
    setSaveState('ok');
  }catch(e){
    try{
      await new Promise(r=>setTimeout(r,1500));
      await Store.save(state.lastResult);
      setSaveState('ok');
    }catch(e2){ console.error('save',e2); setSaveState('fail'); }
  }
}
function setSaveState(s){
  state.saveState=s;
  const el=document.getElementById('save-status');
  if(el) el.outerHTML=saveStatusHTML(s);
}
function saveStatusHTML(s){
  if(s==='ok')    return `<div id="save-status" class="savebar ok no-print">✓ 결과가 저장됐어요 · 진행자 집계에 반영됩니다.</div>`;
  if(s==='fail')  return `<div id="save-status" class="savebar fail no-print">결과 저장이 지연되고 있어요. 인터넷 연결을 확인한 뒤 <button class="linkbtn" data-action="retrySave">다시 저장</button>하거나 진행자에게 알려 주세요.</div>`;
  if(s==='local') return `<div id="save-status" class="savebar local no-print">이 기기에만 임시 저장됨 · 집계 미연결 상태</div>`;
  return `<div id="save-status" class="savebar saving no-print">결과 저장 중…</div>`;
}

/* ── 세션(회차) 동작 ── */
function sessionStart(){
  const now=new Date();
  const act=activeSession_();
  if(act){
    if(!confirm('진행 중인 세션이 있어요.\n\n'+sessionLabel_(act)+'\n\n이 세션을 지금 종료하고 새 회차를 시작할까요?\n(참여자 결과는 지워지지 않습니다.)')) return;
    act.end=now.toISOString();
  }
  const s={
    id:'s'+now.getTime().toString(36)+Math.random().toString(36).slice(2,6),
    start:now.toISOString(), end:null, label:''
  };
  state.sessions=(state.sessions||[]).concat([s]);
  persistSessions_();
  state.adminSessionFilter=s.id;
  state.adminTeamFilter='';
  state.groups=null;
  render();
}
function sessionEnd(){
  const act=activeSession_(); if(!act) return;
  if(!confirm('현재 세션을 종료할까요?\n\n'+sessionLabel_(act)+'\n\n종료 뒤 들어오는 제출은 이 세션에 포함되지 않아요.\n기록은 남아서 세션 필터로 언제든 다시 볼 수 있습니다.')) return;
  act.end=new Date().toISOString();
  persistSessions_();
  state.groups=null;
  render();
}
function sessionNudge(min){
  const act=activeSession_(); if(!act || !min) return;
  const cur=new Date(act.start).getTime();
  const next=cur+min*60000;
  if(next>Date.now()){ alert('시작 시각을 현재 시각보다 뒤로는 옮길 수 없어요.'); return; }
  const sorted=(state.sessions||[]).slice().sort((a,b)=>new Date(a.start)-new Date(b.start));
  const i=sorted.findIndex(x=>x.id===act.id);
  const prev=i>0?sorted[i-1]:null;
  if(prev){
    const ps=new Date(prev.start).getTime();
    if(next<=ps){ alert('이전 세션의 시작 시각보다 앞으로는 옮길 수 없어요.'); return; }
    // 이전 세션 종료 시각이 이 세션 시작과 맞물려 있으면 함께 이동 (경계 유지)
    if(prev.end && Math.abs(new Date(prev.end).getTime()-cur)<2000) prev.end=new Date(next).toISOString();
  }
  act.start=new Date(next).toISOString();
  persistSessions_();
  state.groups=null;
  render();
}
function sessionRename(id){
  const s=findSession_(id); if(!s) return;
  const v=prompt('세션 이름을 정해 주세요 (예: 오전 A조, 영업2팀)\n비워 두면 기본 이름(날짜·회차)으로 표시돼요.', s.label||'');
  if(v===null) return;
  s.label=String(v).trim().slice(0,40);
  persistSessions_();
  render();
}
function sessionDelete(id){
  const s=findSession_(id); if(!s) return;
  if(!confirm('이 세션 표시를 삭제할까요?\n\n'+sessionLabel_(s)+'\n\n참여자 결과는 그대로 남고, 회차 구분만 사라집니다.')) return;
  state.sessions=(state.sessions||[]).filter(x=>x.id!==id);
  persistSessions_();
  if(state.adminSessionFilter===id) state.adminSessionFilter='';
  state.groups=null;
  render();
}

function openAdminDash(){
  state.screen='adminDash';
  state.sessions=loadSessions_();   // 세션 표시는 이 브라우저(localStorage)에서 매번 새로 읽음
  state.adminLoading=true;
  render(); // shows loader, triggers doLoadAdmin
}
async function doLoadAdmin(){
  state.adminError='';
  try{ state.adminResults=await Store.loadAll(); }
  catch(e){
    state.adminResults=[];
    state.adminError = CONFIGURED
      ? '시트에서 결과를 불러오지 못했어요.'
      : '아직 구글 시트가 연결되지 않았어요. 파일 상단 SHEET_API 에 Apps Script URL을 넣어 주세요.';
  }
  // 처음 열 때 기본값: 진행 중 세션이 있으면 그 세션, 없으면 가장 최근 날짜
  if(state.adminSessionFilter===undefined){
    const act=activeSession_();
    state.adminSessionFilter = act ? act.id : '';
  }
  if(state.adminDateFilter===undefined){
    const ds=uniqueDates_(state.adminResults||[]);
    state.adminDateFilter = ds.length ? ds[0].key : '';
  }
  state.groups=null;
  state.publicMode=false;
  state.adminLoading=false;
  render();
}

async function onAdminClear(){
  if(!confirm('모든 참여자 결과를 삭제할까요?\n삭제 전에 [CSV 내려받기]로 백업해 두는 것을 권장합니다.\n이 작업은 되돌릴 수 없습니다.')) return;
  await Store.clearAll();
  // no-cors라 직접 확인이 안 되므로 재조회로 반영 확인
  try{ await new Promise(r=>setTimeout(r,1200)); state.adminResults=await Store.loadAll(); }
  catch(_){ state.adminResults=[]; }
  render();
}

function exportCsv(){
  const head=['이름','회사명/팀','대표유형','경쟁','협력','타협','회피','수용','자기주장(0-100)','협력성(0-100)','응답시각'];
  const lines=[head.join(',')];
  filteredAdmin().forEach(r=>{
    const d=dominantModes(r.scores).map(k=>MODES[k].name).join('/');
    const c=centroid(r.scores);
    const row=[
      r.name, r.team||'', d,
      r.scores.comp,r.scores.collab,r.scores.compr,r.scores.avoid,r.scores.accom,
      Math.round(c.assert*100),Math.round(c.coop*100),
      new Date(r.ts).toLocaleString('ko-KR')
    ].map(v=>{
      const s=String(v);
      return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
    });
    lines.push(row.join(','));
  });
  const csv='\uFEFF'+lines.join('\r\n'); // BOM for Excel(한글)
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const p=n=>String(n).padStart(2,'0'); const dt=new Date();
  const curS=findSession_(state.adminSessionFilter||'');
  const tag=curS ? sessionTag_(curS)
        : (state.adminDateFilter ? state.adminDateFilter.replace(/-/g,'') : `${dt.getFullYear()}${p(dt.getMonth()+1)}${p(dt.getDate())}_전체`);
  a.href=url;
  a.download=`갈등관리진단_집계_${tag}.csv`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* boot */
if(ADMIN_MODE){
  state.screen = state.adminAuthed ? 'adminDash' : 'adminLogin';
  if(state.screen==='adminDash') state.adminLoading=true;
}
render();
</script>
